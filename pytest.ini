# pytest.ini  (repo root)
[pytest]
cache_dir = /tmp/pytest_cache
env =
    D:DATABASE_URL=sqlite:///:memory:
    D:FLASK_ENV=testing
    D:TESTING=true
# pytest-env reads pytest.ini BEFORE any module is imported. conftest.py fixtures
# run too late as app.py reads DATABASE_URL at import time via SQLAlchemy, so pytest.ini
# is required. D: prefix = "default": only set the variable if it is NOT already present
# in the environment. Without D:, pytest-env  OVERWRITES the MySQL DATABASE_URL that
# Jenkins exports for the Integration Tests stage, silently rerouting those tests
# to in-memory SQLite.
